services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy # wait for PostgreSQL to be ready

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB__NAME:-wuda}
      POSTGRES_USER: ${DB__USER:-wuda}
      POSTGRES_PASSWORD: ${DB__PASSWORD:?Set DB__PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data # persist database data
    healthcheck: # check whether PostgreSQL accepts connections
      test: ["CMD-SHELL", "pg_isready -U ${DB__USER:-wuda} -d ${DB__NAME:-wuda}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: # keep data when containers are recreated