[project]
name = "wuda"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.2",
    "django-environ>=0.14.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]

# RUFF CONFIGURATION
[tool.ruff]
line-length = 120
exclude = [
    ".venv",
    "migrations",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
# E - detects code style issues and formatting errors
# F - detects logical errors, unused imports, and undefined names
# I - checks and organizes import order