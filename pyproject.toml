[project]
name = "wuda"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.2",            # modern, security-supported version for production
    "django-environ>=0.14.0",   # environment configuration
    "gunicorn>=26.2.0",         # production WSGI server
    "psycopg[binary]>=3.3.6",   # connection with PostgreSQL
    "whitenoise>=6.12.0",       # serving static files in production
]

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]

# RUFF CONFIGURATION
[tool.ruff]
line-length = 120
exclude = [
    ".venv",
    "migrations",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
# E - detects code style issues and formatting errors
# F - detects logical errors, unused imports, and undefined names
# I - checks and organizes import order